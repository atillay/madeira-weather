    <circle cx="0" cy="0" r="60" />
    <path d="M 0,-85 L 0,-115" stroke="#fcd34d" stroke-width="18" stroke-linecap="round" />
    <path d="M 0,85 L 0,115" stroke="#fcd34d" stroke-width="18" stroke-linecap="round" />
